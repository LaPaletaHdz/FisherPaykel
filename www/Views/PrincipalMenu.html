<script>
function cargarDatosDesdeLocalStorage() {
    const assetsContainer = document.querySelector('.contenedor'); // Verifica el selector de la clase

    if (!assetsContainer) {
        console.error('El contenedor con la clase .contenedor no existe en el DOM.');
        return;
    }

    // Limpiar el contenedor antes de agregar nuevos elementos
    assetsContainer.innerHTML = '';

    // Obtener los datos de localStorage
    const assets = GetAllMaterials();

    // Verificar si hay datos en el localStorage
    if (assets.length === 0) {
        console.warn('No hay datos en el localStorage.');
        return;
    }

    // Crear los divs para cada objeto en el array
    assets.forEach((asset) => {
        const assetDiv = document.createElement('div');
        assetDiv.className = 'w-80 rounded-lg border border-dark mx-auto mt-4 p-3';
        assetDiv.style.height = 'auto';

        assetDiv.innerHTML = `
            <div><strong>Asset:</strong> ${asset.asset}</div>
            <div><strong>Ubicación:</strong> ${asset.location}</div>
            <div><strong>Modelo:</strong> ${asset.model}</div>
            <div><strong>Marca:</strong> ${asset.branch}</div>
            <div><strong>Número de serie:</strong> ${asset.serial}</div>
            <div><strong>Estado Actual:</strong> ${asset.state}</div>
            <div><strong>Descripción:</strong> ${asset.description}</div>
        `;

        // Agregar el div al contenedor
        assetsContainer.appendChild(assetDiv);
    });
}


setInterval(cargarDatosDesdeLocalStorage, 1000);

    var Materialform = document.querySelector('.MaterialForm');

    Materialform.addEventListener('submit', (e) => {
    e.preventDefault();

        var AssetForm = document.getElementById('Asset').value;
        var LocationForm = document.getElementById('location').value;
        var ModelForm = document.getElementById('model').value;
        var BranchForm = document.getElementById('branch').value;
        var SerialForm = document.getElementById('serial').value;
        var StateForm = document.getElementById('state').value;
        var DescriptionForm = document.getElementById('description').value;

        var material = {
            asset: AssetForm,
            location: LocationForm,
            model: ModelForm,
            branch: BranchForm,
            serial: SerialForm,
            state: StateForm,
            description: DescriptionForm
        }

        Savematerials(material);
        
});
</script>
