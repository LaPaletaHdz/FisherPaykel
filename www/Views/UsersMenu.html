<script> 

function cargarUsuariosDesdeLocalStorage() {
    var assetsContainer = document.querySelector('.UserContainer'); // Verifica el selector de la clase

    if (!assetsContainer) {
        console.error('El contenedor con la clase .contenedor no existe en el DOM.');
        return;
    }

    // Limpiar el contenedor antes de agregar nuevos elementos
    assetsContainer.innerHTML = '';

    // Obtener los datos de localStorage
    var users = GetAllUsersComplete();

    // Verificar si hay datos en el localStorage
    if (users.length === 0) {
        console.warn('No hay usuarios en el localStorage.');
        return;
    }

    // Crear los divs para cada usuario en el array
    users.forEach((user) => {
        const userDiv = document.createElement('div');
        userDiv.className = 'w-80 rounded-lg border border-dark mx-auto mt-3 p-3';
        userDiv.style.height = 'auto';

        userDiv.innerHTML = `
            <div><strong>Nombre:</strong> ${user.firstname} ${user.lastname}</div>
            <div><strong>Correo:</strong> ${user.email}</div>
            <div><strong>Contraseña:</strong> ${user.password}</div>
            <div><strong>Área:</strong> ${user.area}</div>
            <div><strong>Puesto:</strong> ${user.position}</div>
            <div class="d-flex justify-content-end">
                <i class="bi bi-pencil-square fs-1"></i>
                <i class="bi bi-trash-fill fs-1 ms-3"></i>
            </div>
        `;

        // Agregar el div al contenedor
        assetsContainer.appendChild(userDiv);
    });
}

setInterval(cargarUsuariosDesdeLocalStorage, 1000);


        var UsersForms = document.querySelector('.UsersForms');

        UsersForms.addEventListener('submit', (e) => {
        e.preventDefault();

            var UsersFormsEmail = document.getElementById('UsersFormsEmail').value;

            var userforms = {
                email: UsersFormsEmail,
                password: UsersFormsPassword,
                firstname: "",
                lastname: "",
                area: "",

            }

            SaveusersComplete(userforms);
            
        });

</script>
